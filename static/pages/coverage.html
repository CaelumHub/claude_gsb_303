<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代码覆盖率 - 自动化测试与持续集成平台</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .build-item { border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; margin-bottom: 8px;
      cursor: pointer; transition: all .12s; }
    .build-item:hover { border-color: var(--primary); }
    .build-item.active { border-color: var(--primary); background: var(--primary-soft); }
    .build-list { max-height: 520px; overflow: auto; }
    .delta-up { color: var(--green); font-weight: 600; }
    .delta-down { color: var(--red); font-weight: 600; }
    .delta-flat { color: var(--text-muted); }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="site-sidebar"></aside>

  <main class="main">
    <h1 class="page-title">代码覆盖率</h1>
    <p class="page-desc">按构建查看模拟源码树的覆盖率，覆盖率与通过率弱相关、同一构建结果稳定。</p>

    <div class="card">
      <div class="row">
        <label style="margin:0 6px 0 0;align-self:center">项目</label>
        <select id="project-select" style="max-width:240px" onchange="switchProject(this.value)"></select>
        <label style="margin:0 6px 0 6px;align-self:center">基线</label>
        <select id="baseline-select" style="max-width:320px" onchange="onBaselineChange()"></select>
        <span style="flex:1"></span>
        <button class="btn secondary" id="btn-refresh">刷新</button>
      </div>
    </div>

    <div class="grid cols-2">
      <section class="card">
        <h2>构建列表</h2>
        <div class="build-list" id="build-list"><div class="empty">加载中…</div></div>
      </section>

      <section class="card">
        <h2 style="margin:0" id="cov-title">覆盖率详情</h2>
        <div id="cov-body"><div class="empty">请选择左侧构建</div></div>
      </section>
    </div>

    <section class="card">
      <h2>覆盖率趋势</h2>
      <div id="trend"><div class="empty">加载中…</div></div>
    </section>
  </main>
</div>

<script src="/static/js/common.js"></script>
<script>
renderNav("coverage");

let projectId = null;
let builds = [];
let currentBuild = null;

async function init() {
  const params = new URLSearchParams(location.search);
  projectId = await fillProjectSelect($("#project-select"), params.get("project_id"));
  await loadAll();
  if (builds[0]) selectBuild(builds[0].id);
}

async function switchProject(id) { projectId = id; currentBuild = null; await loadAll(); }

async function loadAll() {
  if (!projectId) return;
  await Promise.all([loadBuilds(), loadTrend(), loadBaselines()]);
}

/* ---------- 发布基线 ---------- */
async function loadBaselines() {
  const d = await api(`/api/projects/${projectId}/baselines`);
  const baselines = d.baselines || [];
  const sel = $("#baseline-select");
  const prev = sel.value;
  sel.innerHTML = '<option value="">— 不对比基线 —</option>' +
    baselines.map(b => `<option value="${b.id}">${esc(b.label)} · 覆盖率 ${b.coverage_percent ?? "—"}%</option>`).join("");
  if (baselines.some(b => b.id === prev)) sel.value = prev;
}

function currentBaselineId() { return $("#baseline-select").value || null; }

async function onBaselineChange() { if (currentBuild) selectBuild(currentBuild); }

async function loadBuilds() {
  const d = await api(`/api/builds?project_id=${projectId}`);
  builds = d.builds || [];
  const host = $("#build-list");
  if (!builds.length) { host.innerHTML = '<div class="empty">暂无构建，先执行一次测试。</div>'; return; }
  host.innerHTML = builds.map(b => `
    <div class="build-item ${b.id===currentBuild?'active':''}" onclick="selectBuild('${b.id}')">
      <div class="row spread"><strong>${esc(b.name||b.id)}</strong>${statusBadge(b.status)}</div>
      <div class="muted" style="font-size:12px">通过率 ${b.total?Math.round(b.passed/b.total*100):0}% · ${fmtTime(b.finished_at)}</div>
    </div>`).join("");
}

async function loadTrend() {
  const d = await api(`/api/projects/${projectId}/coverage/trend`);
  const pts = d.points || [];
  const host = $("#trend");
  if (!pts.length) { host.innerHTML = '<div class="empty">暂无覆盖率数据</div>'; return; }
  host.innerHTML = `<table><thead><tr><th>构建</th><th>状态</th><th>覆盖率</th><th>通过率</th></tr></thead><tbody>` +
    pts.map(p => `<tr><td class="mono" style="font-size:12px">${esc(p.name||p.build_id)}</td>
      <td>${statusBadge(p.status)}</td><td><strong>${p.percent}%</strong></td>
      <td>${Math.round(p.passed_ratio*100)}%</td></tr>`).join("") + "</tbody></table>";
}

async function selectBuild(id) {
  currentBuild = id;
  loadBuilds();
  const c = await api(`/api/builds/${id}/coverage`);
  let diff = null;
  const bid = currentBaselineId();
  if (bid) {
    try { diff = await api(`/api/builds/${id}/compare?baseline_id=${bid}`); }
    catch (e) { toast(e.message, "err"); }
  }
  renderCoverage(c, diff);
}

function deltaHtml(delta, unit, goodWhenUp) {
  const d = Number(delta || 0);
  const cls = d === 0 ? "delta-flat" : ((d > 0) === goodWhenUp ? "delta-up" : "delta-down");
  return `<span class="${cls}">${d > 0 ? "+" : ""}${d.toFixed(1)}${unit}</span>`;
}

function renderCoverage(c, diff) {
  $("#cov-title").textContent = `覆盖率详情 · ${c.percent}%`;
  const files = c.files || [];
  const covDiff = diff && diff.coverage ? diff.coverage : null;
  const base = diff && diff.baseline ? diff.baseline : null;
  const fileDeltas = {};
  if (covDiff) (covDiff.files || []).forEach(f => { fileDeltas[f.file] = f; });
  $("#cov-body").innerHTML = `
    ${covDiff ? `<div class="mt" style="border:1px solid var(--primary);border-radius:10px;padding:12px 14px">
      <h3 style="margin-top:0">对比基线 · ${esc(base.label || "")}
        <span class="muted" style="font-size:12px;font-weight:400">（基线构建 ${esc(base.build_name || base.build_id)} · 固化于 ${fmtTime(base.created_at)}）</span></h3>
      <div class="grid cols-3">
        <div class="stat"><div class="v">${deltaHtml(covDiff.percent.delta, "%", true)}</div>
          <div class="k">总覆盖率差异（${covDiff.percent.baseline}% → ${covDiff.percent.current}%）</div></div>
        <div class="stat"><div class="v">${covDiff.covered_lines.delta > 0 ? "+" : ""}${covDiff.covered_lines.delta}</div>
          <div class="k">覆盖行差异（${covDiff.covered_lines.baseline} → ${covDiff.covered_lines.current}）</div></div>
        <div class="stat"><div class="v">${(covDiff.files || []).filter(f => f.delta < 0).length}</div>
          <div class="k">覆盖率下降的文件数</div></div>
      </div></div>` : ""}
    <div class="grid cols-3 mt">
      <div class="stat primary"><div class="v">${c.percent}%</div><div class="k">总体覆盖率</div></div>
      <div class="stat good"><div class="v">${c.covered_lines}</div><div class="k">覆盖行</div></div>
      <div class="stat bad"><div class="v">${c.missed_lines}</div><div class="k">未覆盖行</div></div>
    </div>
    <div class="mt">${files.map(f => `
      <div class="cov-row">
        <span class="fname" title="${esc(f.file)}">${esc(f.file)}</span>
        <div class="bar ${f.percent>=80?'green':f.percent>=50?'amber':'red'}"><i style="width:${f.percent}%"></i></div>
        <span class="pct">${f.percent}%${fileDeltas[f.file] && fileDeltas[f.file].delta !== 0
          ? ` <span class="${fileDeltas[f.file].delta > 0 ? 'delta-up' : 'delta-down'}" style="font-size:11px">(${fileDeltas[f.file].delta > 0 ? "+" : ""}${fileDeltas[f.file].delta})</span>`
          : ""}</span>
      </div>`).join("")}</div>
    <div class="mt muted" style="font-size:12px">模拟源码树 · 共 ${c.total_lines} 行，覆盖 ${c.covered_lines} 行。</div>`;
}

$("#btn-refresh").onclick = async () => { await loadAll(); if (currentBuild) selectBuild(currentBuild); };

init();
</script>
</body>
</html>
